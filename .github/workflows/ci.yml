name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency can become vulnerable without any change to this repo, so the
    # supply-chain job also runs on a schedule rather than only on pushes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test: ${{ steps.filter.outputs.test }}
      msrv: ${{ steps.filter.outputs.msrv }}
      wasm: ${{ steps.filter.outputs.wasm }}
      python_bindings: ${{ steps.filter.outputs.python_bindings }}
      presentation_fidelity: ${{ steps.filter.outputs.presentation_fidelity }}
      word_fidelity: ${{ steps.filter.outputs.word_fidelity }}
      hash_harness: ${{ steps.filter.outputs.hash_harness }}
      supply_chain: ${{ steps.filter.outputs.supply_chain }}
      prose: ${{ steps.filter.outputs.prose }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            test:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'examples/**'
              - 'scripts/**'
              - 'tests/**'
              - 'tools/**'
            msrv:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'examples/**'
              - 'scripts/**'
              - 'tests/**'
              - 'tools/**'
            wasm:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'crates/**'
            python_bindings:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'scripts/install_pinned_poppler.py'
            presentation_fidelity:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'scripts/fetch_pptx_corpus.py'
              - 'scripts/install_pinned_poppler.py'
              - 'scripts/pptx-corpus-manifest.tsv'
              - 'scripts/pptx_ssim_harness.py'
            word_fidelity:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'scripts/docx-corpus-manifest.tsv'
              - 'scripts/docx_ssim_harness.py'
              - 'scripts/fetch_docx_corpus.py'
              - 'scripts/golden_png_harness.py'
              - 'scripts/install_pinned_libreoffice.py'
              - 'scripts/install_pinned_poppler.py'
              - 'scripts/pptx_ssim_harness.py'
            hash_harness:
              - '.github/workflows/ci.yml'
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'scripts/**'
            supply_chain:
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'deny.toml'
              - 'LICENSE'
              - 'crates/**/Cargo.toml'
              - 'crates/**/LICENSE*'
              - 'crates/**/NOTICE*'
            prose:
              - '.github/workflows/ci.yml'
              - '*.md'
              - '**/*.md'
              - '.claude/commands/**'
              - '.claude/skills/**'
              - '.agents/skills/**'
              - 'scripts/prose_check.py'
              - 'scripts/sync_agent_skills.py'

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up uv 0.10.2
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          enable-cache: false
      - name: Install pinned Poppler 26.01.0
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake g++ ninja-build pkg-config \
            libfontconfig1-dev libfreetype-dev libjpeg-turbo8-dev \
            libpng-dev libtiff-dev libopenjp2-7-dev liblcms2-dev zlib1g-dev
          python3 scripts/install_pinned_poppler.py
      - name: Install pinned LibreOffice 26.2.5.2
        run: python3 scripts/install_pinned_libreoffice.py
      - name: Fetch pinned presentation corpus
        run: python3 scripts/fetch_pptx_corpus.py
      - name: Fetch pinned Word corpus
        run: python3 scripts/fetch_docx_corpus.py
      - name: Install pinned EPUBCheck 5.3.0
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/epubcheck-5.3.0.zip"
          root="${RUNNER_TEMP}/epubcheck-5.3.0"
          curl --fail --location --silent --show-error \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip \
            --output "$archive"
          echo "6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  $archive" \
            | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          jar="${root}/epubcheck.jar"
          echo "f7f96617c929371821609b88c8484d6dc9f24fe916499863c46094c5fb778a65  $jar" \
            | sha256sum --check
          echo "EPUBCHECK_JAR=$jar" >> "$GITHUB_ENV"
      - name: Run pinned EPUBCheck gate
        run: >-
          cargo test --locked -p rdocx
          epubcheck_5_3_0_accepts_the_source_built_publication
          --lib -- --ignored --nocapture
      - name: Run thousand-page performance gate
        run: >-
          cargo test --locked --release -p rdocx
          --test regression_test
          a_thousand_page_document_paginates_and_renders_within_the_declared_limits
          -- --ignored --exact --test-threads=1 --nocapture
      - name: Run full workspace suite
        env:
          UV_CACHE_DIR: "${{ runner.temp }}/uv-cache"
          RUST_MIN_STACK: "8388608"
        run: >-
          cargo test --workspace --all-features
          --exclude rdocx-py --exclude rpptx-py
      - name: Run golden-PNG gate
        run: python3 scripts/golden_png_harness.py --check

  python-bindings:
    needs: changes
    if: needs.changes.outputs.python_bindings == 'true'
    name: Python bindings (${{ matrix.package.distribution }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package:
          - { distribution: rdocx, crate: rdocx-py, oracle: "python-docx==1.2.0" }
          - { distribution: rpptx, crate: rpptx-py, oracle: "python-pptx==1.0.2" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.9"
      - name: Install pinned Poppler 26.01.0
        shell: bash
        run: |
          brew install \
            cmake ninja pkg-config fontconfig freetype jpeg-turbo \
            libpng libtiff little-cms2 openjpeg
          python3 scripts/install_pinned_poppler.py
      - name: Create isolated binding environment
        shell: bash
        run: |
          binding_venv="${RUNNER_TEMP}/${{ matrix.package.distribution }}-venv"
          python -m venv "$binding_venv"
          binding_python="$binding_venv/bin/python"
          "$binding_python" -m pip install \
            maturin==1.13.3 \
            pytest==9.1.1 \
            "${{ matrix.package.oracle }}"
      - name: Build Python extension
        shell: bash
        run: |
          binding_venv="${RUNNER_TEMP}/${{ matrix.package.distribution }}-venv"
          binding_python="$binding_venv/bin/python"
          VIRTUAL_ENV="$binding_venv" \
            "$binding_python" -m maturin develop --locked \
              --manifest-path "crates/${{ matrix.package.crate }}/Cargo.toml"
      - name: Run full Python binding suite
        shell: bash
        run: |
          binding_venv="${RUNNER_TEMP}/${{ matrix.package.distribution }}-venv"
          binding_python="$binding_venv/bin/python"
          "$binding_python" -m pytest "crates/${{ matrix.package.crate }}/tests"

  no-default-features:
    name: No default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p oxml-layout --no-default-features

  wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Set up Node 24.11.1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.11.1"
      - name: Install wasm-pack 0.15.0
        shell: bash
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Install wasm-opt 125
        shell: bash
        run: |
          binaryen_archive="${RUNNER_TEMP}/binaryen-version_125-x86_64-linux.tar.gz"
          binaryen_root="${RUNNER_TEMP}/binaryen-version_125"
          curl --fail --location --silent --show-error "https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz" --output "$binaryen_archive"
          echo "7c3bc16599c8274a04d34a504fe4be2047884f900e0e2da2f6fb9cd667183be4  $binaryen_archive" | sha256sum --check
          mkdir -p "$binaryen_root"
          tar --extract --gzip --file "$binaryen_archive" --directory "$binaryen_root" --strip-components=1
          echo "$binaryen_root/bin" >> "$GITHUB_PATH"
          test "$("$binaryen_root/bin/wasm-opt" --version)" = "wasm-opt version 125 (version_125)"
      - name: Check WASM targets
        shell: bash
        run: |
          cargo check --locked --target wasm32-unknown-unknown -p rdocx-wasm
          cargo check --locked --target wasm32-unknown-unknown -p rpptx-wasm
      - name: Run WASM Node tests
        shell: bash
        run: |
          wasm-pack test --node crates/rdocx-wasm
          wasm-pack test --node crates/rpptx-wasm
      - name: Build and install local WASM packages
        shell: bash
        run: |
          package_root="${RUNNER_TEMP}/wasm-packages"
          tarball_root="${RUNNER_TEMP}/wasm-tarballs"
          npm_cache="${RUNNER_TEMP}/npm-cache"
          mkdir -p "$package_root" "$tarball_root" "$npm_cache"
          wasm-pack build --target bundler --scope tensorbee --release --out-dir "$package_root/rdocx-wasm" crates/rdocx-wasm --locked
          wasm-pack build --target bundler --scope tensorbee --release --out-dir "$package_root/rpptx-wasm" crates/rpptx-wasm --locked

          assert_inventory() {
            local inventory_root="$1"
            local expected_name="$2"
            local expected_version="$3"
            local stem="$4"
            node --input-type=module - "$inventory_root" "$expected_name" "$expected_version" "$stem" <<'NODE'
          import { existsSync, readFileSync } from "node:fs";

          const [inventoryRoot, expectedName, expectedVersion, stem] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync(`${inventoryRoot}/package.json`, "utf8"));
          if (manifest.name !== expectedName || manifest.version !== expectedVersion) {
            throw new Error(`unexpected package identity ${manifest.name}@${manifest.version}`);
          }
          for (const file of [
            `${stem}_bg.wasm`,
            `${stem}.js`,
            `${stem}.d.ts`,
          ]) {
            if (!existsSync(`${inventoryRoot}/${file}`)) {
              throw new Error(`missing package file ${file}`);
            }
          }
          NODE
          }

          verify_package() {
            local package_dir="$1"
            local expected_name="$2"
            local expected_version="$3"
            local stem="$4"
            local tarball
            local consumer_root
            local installed_root
            assert_inventory "$package_dir" "$expected_name" "$expected_version" "$stem"
            tarball="$(npm pack "$package_dir" --cache "$npm_cache" --ignore-scripts --pack-destination "$tarball_root")"
            consumer_root="$(mktemp -d "${RUNNER_TEMP}/${stem}-consumer.XXXXXX")"
            npm install --prefix "$consumer_root" --cache "$npm_cache" --ignore-scripts --no-audit --no-fund --package-lock=false "$tarball_root/$tarball"
            installed_root="$consumer_root/node_modules/$expected_name"
            assert_inventory "$installed_root" "$expected_name" "$expected_version" "$stem"
            (
              cd "$consumer_root"
              node --experimental-wasm-modules --input-type=module --eval "import(\"$expected_name\")"
            )
          }

          verify_package "$package_root/rdocx-wasm" "@tensorbee/rdocx-wasm" "0.10.1" "rdocx_wasm"
          verify_package "$package_root/rpptx-wasm" "@tensorbee/rpptx-wasm" "0.6.0" "rpptx_wasm"

  release-regressions:
    name: Release regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-release 1.1.3
        run: cargo install cargo-release --version 1.1.3 --locked
      - name: Run release regressions
        run: python3 -m unittest scripts.test_sprint_workflow

  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    name: Prose and generated skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/prose_check.py
      - run: python3 scripts/sync_agent_skills.py --check

  hash-harness:
    needs: changes
    if: needs.changes.outputs.hash_harness == 'true'
    name: Output stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/hash_harness.py --check

  presentation-fidelity:
    needs: changes
    if: needs.changes.outputs.presentation_fidelity == 'true'
    name: Presentation fidelity
    runs-on: macos-26
    env:
      RDOCX_PPTX_CORPUS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned LibreOffice
        run: |
          brew install --cask libreoffice
      - name: Install pinned Poppler 26.01.0
        shell: bash
        run: |
          brew install \
            cmake ninja pkg-config fontconfig freetype jpeg-turbo \
            libpng libtiff little-cms2 openjpeg
          python3 scripts/install_pinned_poppler.py
      - name: Fetch pinned presentation corpus
        run: python3 scripts/fetch_pptx_corpus.py
      - name: Run all-slide SSIM trend and completeness gate
        run: >-
          python3 scripts/pptx_ssim_harness.py --check
          --output-dir "${RUNNER_TEMP}/presentation-fidelity"
      - name: Retain presentation fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-fidelity-evidence
          path: |
            ${{ runner.temp }}/presentation-fidelity/gate-evidence.json
            ${{ runner.temp }}/presentation-fidelity/render-manifest.tsv
            ${{ runner.temp }}/presentation-fidelity/ssim-results.tsv
          if-no-files-found: warn

  word-fidelity:
    needs: changes
    if: needs.changes.outputs.word_fidelity == 'true'
    name: Word fidelity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Fetch locked Cargo dependencies
        run: cargo fetch --locked
      - name: Install pinned Poppler 26.01.0
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake g++ ninja-build pkg-config \
            libfontconfig1-dev libfreetype-dev libjpeg-turbo8-dev \
            libpng-dev libtiff-dev libopenjp2-7-dev liblcms2-dev zlib1g-dev
          python3 scripts/install_pinned_poppler.py
      - name: Install pinned LibreOffice 26.2.5.2
        run: python3 scripts/install_pinned_libreoffice.py
      - name: Fetch pinned Word corpus
        run: python3 scripts/fetch_docx_corpus.py
      - name: Run all-page Word SSIM trend and completeness gate
        run: >-
          python3 scripts/docx_ssim_harness.py --check
          --output-dir "${RUNNER_TEMP}/word-fidelity"
      - name: Retain Word fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-fidelity-evidence
          path: |
            ${{ runner.temp }}/word-fidelity/gate-evidence.json
            ${{ runner.temp }}/word-fidelity/ssim-results.tsv
          if-no-files-found: error

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo clippy --workspace --all-targets --all-features
          --exclude rdocx-py --exclude rpptx-py -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo doc --workspace --no-deps --all-features
          --exclude rdocx-py --exclude rpptx-py
      - name: Check README Rust examples
        run: python3 scripts/readme_doctests.py

  package-oxml-layout:
    name: Package oxml-layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check package inventory
        shell: bash
        run: |
          if grep -Eq '^publish[[:space:]]*=[[:space:]]*false' crates/oxml-layout/Cargo.toml; then
            echo "oxml-layout is still excluded from publication" >&2
            exit 1
          fi

          packaged_fonts=$(
            cargo package -p oxml-layout --list |
              grep -E '^fonts/.*\.ttf$' |
              sort
          )
          expected_fonts="$(printf '%s\n' \
            fonts/Caladea-Bold.ttf \
            fonts/Caladea-BoldItalic.ttf \
            fonts/Caladea-Italic.ttf \
            fonts/Caladea-Regular.ttf \
            fonts/Carlito-Bold.ttf \
            fonts/Carlito-BoldItalic.ttf \
            fonts/Carlito-Italic.ttf \
            fonts/Carlito-Regular.ttf \
            fonts/LiberationMono-Bold.ttf \
            fonts/LiberationMono-BoldItalic.ttf \
            fonts/LiberationMono-Italic.ttf \
            fonts/LiberationMono-Regular.ttf \
            fonts/LiberationSans-Bold.ttf \
            fonts/LiberationSans-BoldItalic.ttf \
            fonts/LiberationSans-Italic.ttf \
            fonts/LiberationSans-Regular.ttf \
            fonts/LiberationSerif-Bold.ttf \
            fonts/LiberationSerif-BoldItalic.ttf \
            fonts/LiberationSerif-Italic.ttf \
            fonts/LiberationSerif-Regular.ttf)"
          diff -u \
            <(printf '%s\n' "$expected_fonts") \
            <(printf '%s\n' "$packaged_fonts")

          packaged_legal=$(
            cargo package -p oxml-layout --list |
              grep -E '^fonts/(LICENSE|NOTICE)-' |
              sort
          )
          expected_legal="$(printf '%s\n' \
            fonts/LICENSE-Caladea \
            fonts/LICENSE-Carlito \
            fonts/LICENSE-Liberation \
            fonts/NOTICE-Caladea)"
          diff -u \
            <(printf '%s\n' "$expected_legal") \
            <(printf '%s\n' "$packaged_legal")
      - name: Verify package and archive size
        shell: bash
        run: |
          cargo package -p oxml-layout
          archive=$(find target/package -maxdepth 1 -name 'oxml-layout-*.crate' -print -quit)
          if [ -z "$archive" ]; then
            echo "oxml-layout archive was not generated" >&2
            exit 1
          fi
          archive_size=$(stat -c %s "$archive")
          if [ "$archive_size" -gt 10485760 ]; then
            echo "package exceeds 10 MiB: $archive ($archive_size bytes)" >&2
            exit 1
          fi

  msrv:
    needs: changes
    if: needs.changes.outputs.msrv == 'true'
    name: MSRV (1.93)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - name: Set up uv 0.10.2
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          enable-cache: false
      - name: Install pinned Poppler 26.01.0
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake g++ ninja-build pkg-config \
            libfontconfig1-dev libfreetype-dev libjpeg-turbo8-dev \
            libpng-dev libtiff-dev libopenjp2-7-dev liblcms2-dev zlib1g-dev
          python3 scripts/install_pinned_poppler.py
      - name: Install pinned LibreOffice 26.2.5.2
        run: python3 scripts/install_pinned_libreoffice.py
      - name: Fetch pinned presentation corpus
        run: python3 scripts/fetch_pptx_corpus.py
      - name: Fetch pinned Word corpus
        run: python3 scripts/fetch_docx_corpus.py
      - name: Run full workspace suite
        env:
          UV_CACHE_DIR: "${{ runner.temp }}/uv-cache"
          RUST_MIN_STACK: "8388608"
        run: >-
          cargo test --workspace --all-features
          --exclude rdocx-py --exclude rpptx-py

  supply-chain:
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       needs.changes.outputs.supply_chain == 'true')
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cargo-deny reads the same RustSec advisory database as cargo-audit, and
      # additionally honours the documented exceptions in deny.toml and checks
      # licences, banned crates and source registries. Running audit-check as
      # well would duplicate the advisory scan, re-report the exceptions
      # deny.toml already accounts for, and need `checks: write` on the token
      # just to publish its check run.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - test
      - msrv
      - wasm
      - python-bindings
      - presentation-fidelity
      - word-fidelity
      - hash-harness
      - supply-chain
      - prose
    runs-on: ubuntu-latest
    steps:
      - name: Validate filtered jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_SELECTED: ${{ needs.changes.outputs.test }}
          TEST_RESULT: ${{ needs.test.result }}
          MSRV_SELECTED: ${{ needs.changes.outputs.msrv }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          WASM_SELECTED: ${{ needs.changes.outputs.wasm }}
          WASM_RESULT: ${{ needs.wasm.result }}
          PYTHON_BINDINGS_SELECTED: ${{ needs.changes.outputs.python_bindings }}
          PYTHON_BINDINGS_RESULT: ${{ needs['python-bindings'].result }}
          PRESENTATION_FIDELITY_SELECTED: ${{ needs.changes.outputs.presentation_fidelity }}
          PRESENTATION_FIDELITY_RESULT: ${{ needs['presentation-fidelity'].result }}
          WORD_FIDELITY_SELECTED: ${{ needs.changes.outputs.word_fidelity }}
          WORD_FIDELITY_RESULT: ${{ needs['word-fidelity'].result }}
          HASH_HARNESS_SELECTED: ${{ needs.changes.outputs.hash_harness }}
          HASH_HARNESS_RESULT: ${{ needs['hash-harness'].result }}
          SUPPLY_CHAIN_SELECTED: ${{ needs.changes.outputs.supply_chain }}
          SUPPLY_CHAIN_RESULT: ${{ needs['supply-chain'].result }}
          PROSE_SELECTED: ${{ needs.changes.outputs.prose }}
          PROSE_RESULT: ${{ needs.prose.result }}
        run: |
          check_result() {
            local selected="$1"
            local result="$2"
            local job="$3"
            case "$selected:$result" in
              true:success|false:skipped)
                ;;
              *)
                echo "$job was selected=$selected but concluded $result" >&2
                return 1
                ;;
            esac
          }

          if [ "$EVENT_NAME" = "schedule" ]; then
            test "$CHANGES_RESULT" = "skipped"
            test_selected=false
            msrv_selected=false
            wasm_selected=false
            python_bindings_selected=false
            presentation_fidelity_selected=false
            word_fidelity_selected=false
            hash_harness_selected=false
            supply_chain_selected=true
            prose_selected=false
          else
            test "$CHANGES_RESULT" = "success"
            test_selected="$TEST_SELECTED"
            msrv_selected="$MSRV_SELECTED"
            wasm_selected="$WASM_SELECTED"
            python_bindings_selected="$PYTHON_BINDINGS_SELECTED"
            presentation_fidelity_selected="$PRESENTATION_FIDELITY_SELECTED"
            word_fidelity_selected="$WORD_FIDELITY_SELECTED"
            hash_harness_selected="$HASH_HARNESS_SELECTED"
            supply_chain_selected="$SUPPLY_CHAIN_SELECTED"
            prose_selected="$PROSE_SELECTED"
          fi

          check_result "$test_selected" "$TEST_RESULT" test
          check_result "$msrv_selected" "$MSRV_RESULT" msrv
          check_result "$wasm_selected" "$WASM_RESULT" wasm
          check_result "$python_bindings_selected" "$PYTHON_BINDINGS_RESULT" python-bindings
          check_result "$presentation_fidelity_selected" "$PRESENTATION_FIDELITY_RESULT" presentation-fidelity
          check_result "$word_fidelity_selected" "$WORD_FIDELITY_RESULT" word-fidelity
          check_result "$hash_harness_selected" "$HASH_HARNESS_RESULT" hash-harness
          check_result "$supply_chain_selected" "$SUPPLY_CHAIN_RESULT" supply-chain
          check_result "$prose_selected" "$PROSE_RESULT" prose
