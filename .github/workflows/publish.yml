name: Publish

on:
  push:
    tags: ["v*", "rpptx-v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2

      - name: Verify output stability
        run: python3 scripts/hash_harness.py --check

      - name: Verify release metadata
        run: python3 -m unittest scripts.test_sprint_workflow.SprintWorkflowTests.test_stable_release_family_is_prepared_at_0_12_0 scripts.test_sprint_workflow.SprintWorkflowTests.test_immutable_rdocx_layout_0_10_1_registry_graph_remains_at_oxml_layout_0_6_0 scripts.test_sprint_workflow.SprintWorkflowTests.test_incubating_release_family_is_prepared_at_0_10_0

      - name: Verify published shared family for stable release
        if: startsWith(github.ref_name, 'v')
        run: python3 -m unittest scripts.test_sprint_workflow.SprintWorkflowTests.test_prepared_rdocx_layout_0_12_0_requires_published_oxml_layout_0_10_0
        env:
          RDOCX_VERIFY_PUBLISHED_SHARED: "1"

      - name: Verify reviewed release notes
        run: python3 scripts/sprint_workflow.py release-notes "${{ github.ref_name }}" --check

      - name: Verify publication archives
        run: |
          cargo publish --workspace --dry-run \
            --config 'patch.crates-io.oxml-core.path="crates/oxml-core"' \
            --config 'patch.crates-io.oxml-drawing.path="crates/oxml-drawing"' \
            --config 'patch.crates-io.oxml-layout.path="crates/oxml-layout"' \
            --config 'patch.crates-io.oxml-media.path="crates/oxml-media"' \
            --config 'patch.crates-io.oxml-opc.path="crates/oxml-opc"' \
            --config 'patch.crates-io.oxml-pdf.path="crates/oxml-pdf"' \
            --config 'patch.crates-io.oxml-sml.path="crates/oxml-sml"' \
            --config 'patch.crates-io.oxml-cli-support.path="crates/oxml-cli-support"' \
            --config 'patch.crates-io.oxml-chart.path="crates/oxml-chart"' \
            --config 'patch.crates-io.rdocx.path="crates/rdocx"' \
            --config 'patch.crates-io.rdocx-cli.path="crates/rdocx-cli"' \
            --config 'patch.crates-io.rdocx-html.path="crates/rdocx-html"' \
            --config 'patch.crates-io.rdocx-layout.path="crates/rdocx-layout"' \
            --config 'patch.crates-io.rdocx-opc.path="crates/rdocx-opc"' \
            --config 'patch.crates-io.rdocx-oxml.path="crates/rdocx-oxml"' \
            --config 'patch.crates-io.rdocx-pdf.path="crates/rdocx-pdf"' \
            --config 'patch.crates-io.rpptx.path="crates/rpptx"' \
            --config 'patch.crates-io.rpptx-cli.path="crates/rpptx-cli"' \
            --config 'patch.crates-io.rpptx-chart.path="crates/rpptx-chart"' \
            --config 'patch.crates-io.rpptx-layout.path="crates/rpptx-layout"' \
            --config 'patch.crates-io.rpptx-oxml.path="crates/rpptx-oxml"' \
            --config 'patch.crates-io.rpptx-render.path="crates/rpptx-render"'

      - name: Publish stable allowlist
        if: startsWith(github.ref_name, 'v')
        run: |
          cargo publish -p rdocx-opc
          sleep 60
          cargo publish -p rdocx-oxml
          sleep 60
          cargo publish -p rdocx-layout
          sleep 60
          cargo publish -p rdocx-html
          sleep 60
          cargo publish -p rdocx-pdf
          sleep 60
          cargo publish -p rdocx
          sleep 60
          cargo publish -p rdocx-cli

      - name: Publish incubating allowlist
        if: startsWith(github.ref_name, 'rpptx-v')
        run: |
          cargo publish -p oxml-core
          sleep 60
          cargo publish -p oxml-opc
          sleep 60
          cargo publish -p oxml-media
          sleep 60
          cargo publish -p oxml-layout
          sleep 60
          cargo publish -p oxml-drawing
          sleep 60
          cargo publish -p oxml-pdf
          sleep 60
          cargo publish -p oxml-sml
          sleep 60
          cargo publish -p oxml-cli-support
          sleep 60
          cargo publish -p oxml-chart
          sleep 60
          cargo publish -p rpptx-oxml
          sleep 60
          cargo publish -p rpptx-chart
          sleep 60
          cargo publish -p rpptx-layout
          sleep 60
          cargo publish -p rpptx-render
          sleep 60
          cargo publish -p rpptx
          sleep 60
          cargo publish -p rpptx-cli

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release from reviewed notes
        run: |
          python3 scripts/sprint_workflow.py release-notes "${{ github.ref_name }}" --check
          python3 scripts/sprint_workflow.py release-notes "${{ github.ref_name }}" --render > "$RUNNER_TEMP/release-notes.md"
          python3 scripts/sprint_workflow.py release-notes "${{ github.ref_name }}" --render | cmp - "$RUNNER_TEMP/release-notes.md"
          gh release create "${{ github.ref_name }}" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
