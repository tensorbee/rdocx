[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rdocx"
version = "0.17.0"
requires-python = ">=3.9"
description = "Native DOCX creation, editing, comparison, layout, and rendering for Python"
dynamic = ["readme"]
license = "MIT OR Apache-2.0"
authors = [{ name = "Atul Sharma" }]
keywords = ["docx", "word", "ooxml", "documents", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/tensorbee/rdocx"
Repository = "https://github.com/tensorbee/rdocx"
Issues = "https://github.com/tensorbee/rdocx/issues"
Changelog = "https://github.com/tensorbee/rdocx/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "rdocx._rdocx"
features = ["extension-module"]
