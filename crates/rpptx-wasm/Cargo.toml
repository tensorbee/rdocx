[package]
name = "rpptx-wasm"
description = "WebAssembly bindings for rpptx"
readme = "README.md"
version = "0.11.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["pptx", "powerpoint", "ooxml", "presentation"]
categories = ["parser-implementations", "text-processing"]
publish = false

[package.metadata.release]
shared-version = "incubating"
tag-name = "rpptx-v{{version}}"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
render = ["rpptx/render"]

[dependencies]
rpptx = { workspace = true, default-features = false, features = ["default-template"] }
wasm-bindgen.workspace = true

[dev-dependencies]
js-sys.workspace = true
oxml-opc.workspace = true
wasm-bindgen-test.workspace = true
