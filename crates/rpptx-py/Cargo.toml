[package]
name = "rpptx-py"
description = "Native PPTX creation, editing, comments, notes, and rendering for Python"
readme = "README.md"
version = "0.14.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.release]
shared-version = "incubating"
tag-name = "rpptx-v{{version}}"
pre-release-replacements = [
    { file = "pyproject.toml", search = 'version = "[^"]+"', replace = 'version = "{{version}}"', exactly = 1 },
]

[lib]
name = "_rpptx"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
oxml-drawing = { workspace = true }
oxml-py-support = { workspace = true }
pyo3 = { workspace = true }
rpptx = { workspace = true, features = ["default-template", "render", "system-fonts"] }
smallvec = { workspace = true }
