[package]
name = "oxml-pdf"
description = "Format-neutral PDF renderer for staged OOXML layout output"
readme = "README.md"
version = "0.11.0"
publish = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*", "assets/sRGB2014.icc", "assets/LICENSE-sRGB2014", "README.md"]

[package.metadata.release]
shared-version = "incubating"
tag-name = "rpptx-v{{version}}"

[dependencies]
oxml-layout = { workspace = true, default-features = false }
oxml-media = { workspace = true }
pdf-writer = { workspace = true }
subsetter = { workspace = true }
ttf-parser = { workspace = true }
miniz_oxide = { workspace = true }
tiny-skia = { workspace = true }
zune-jpeg = { workspace = true }
jpeg-encoder = { workspace = true }
tiff = { workspace = true }
