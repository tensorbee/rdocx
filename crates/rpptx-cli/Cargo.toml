[package]
name = "rpptx-cli"
description = "CLI tool for inspecting, converting, and manipulating PPTX files"
readme = "README.md"
version = "0.14.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["pptx", "powerpoint", "ooxml", "presentation"]
categories = ["command-line-utilities", "parser-implementations"]
publish = true

[package.metadata.release]
shared-version = "incubating"
tag-name = "rpptx-v{{version}}"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/rpptx-v{ version }/rpptx-{ target }.tar.gz"
bin-dir = "rpptx{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.'x86_64-pc-windows-msvc']
pkg-url = "{ repo }/releases/download/rpptx-v{ version }/rpptx-{ target }.zip"
pkg-fmt = "zip"

[features]
default = ["system-fonts"]
system-fonts = ["rpptx/system-fonts"]

[[bin]]
name = "rpptx"
path = "src/main.rs"
doc = false

[dependencies]
clap.workspace = true
oxml-cli-support.workspace = true
oxml-layout.workspace = true
oxml-pdf.workspace = true
rpptx = { workspace = true, features = ["render"] }
serde_json.workspace = true

# The local calendar date for `footer --date auto`, which std does not expose.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
oxml-opc.workspace = true
rpptx = { workspace = true, features = ["default-template", "render"] }
