[package]
name = "rpptx-layout"
description = "Presentation layout resolution for PowerPoint-compatible slides"
readme = "README.md"
version = "0.10.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["pptx", "powerpoint", "ooxml", "presentation"]
categories = ["parser-implementations", "text-processing"]
publish = true

[package.metadata.release]
shared-version = "incubating"
tag-name = "rpptx-v{{version}}"

[dependencies]
oxml-drawing.workspace = true
oxml-layout.workspace = true
oxml-chart.workspace = true
rpptx-oxml.workspace = true

[dev-dependencies]
oxml-opc.workspace = true
