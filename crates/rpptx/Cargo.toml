[package]
name = "rpptx"
description = "Read, edit, create, and render PowerPoint-compatible presentations"
readme = "README.md"
version = "0.14.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["pptx", "powerpoint", "ooxml", "presentation"]
categories = ["parser-implementations", "text-processing"]
publish = true

[package.metadata.release]
shared-version = "incubating"
tag-name = "rpptx-v{{version}}"

[features]
default = ["default-template", "render", "system-fonts"]
agile-encryption = ["oxml-opc/agile-encryption"]
default-template = ["dep:scraper"]
digital-signatures = ["oxml-opc/digital-signatures"]
render = [
    "dep:jpeg-encoder",
    "dep:lopdf",
    "lopdf/wasm_js",
    "dep:miniz_oxide",
    "dep:oxml-pdf",
    "dep:rpptx-layout",
    "dep:rpptx-render",
]
system-fonts = ["oxml-layout/system-fonts", "rpptx-render?/system-fonts"]

[dependencies]
oxml-core.workspace = true
oxml-drawing.workspace = true
oxml-layout = { workspace = true, default-features = false }
oxml-media.workspace = true
oxml-opc.workspace = true
oxml-pdf = { workspace = true, optional = true }
oxml-sml.workspace = true
gif.workspace = true
jpeg-encoder = { workspace = true, optional = true, features = ["std"] }
miniz_oxide = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }
oxml-chart.workspace = true
rpptx-layout = { workspace = true, optional = true }
rpptx-oxml.workspace = true
rpptx-render = { workspace = true, default-features = false, optional = true }
quick-xml.workspace = true
scraper = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
zune-jpeg.workspace = true
tiff.workspace = true
zip.workspace = true

[dev-dependencies]
miniz_oxide.workspace = true
oxml-drawing.workspace = true
oxml-layout.workspace = true
oxml-pdf.workspace = true
rpptx-layout.workspace = true
rpptx-render = { workspace = true, features = ["system-fonts"] }

[[example]]
name = "render_deck"
required-features = ["default-template", "render"]
